<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Notes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    h1 {
      font-size: 20px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    input[type=text] {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      margin-top: 10px;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tag-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #999;
      background: white;
      cursor: pointer;
      font-size: 13px;
    }

    .tag-btn.selected {
      background: #1d1d1f;
      color: white;
      border-color: #1d1d1f;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button.action {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
    }

    #saveBtn {
      background: #34a853;
    }

    #queryBtn {
      background: #4285f4;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      display: none;
    }

    #stats {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>Notes</h1>

  <textarea id="content" placeholder="Paste a note, transcript, link, or copied text..."></textarea>

  <div class="tag-row" id="sourceTags">
    <div class="tag-btn selected" data-tag="notes">notes</div>
    <div class="tag-btn" data-tag="copied_text">copied_text</div>
    <div class="tag-btn" data-tag="link">link (current_tab)</div>
    <div class="tag-btn" data-tag="transcript">transcript</div>
  </div>

  <input type="text" id="extraTags" placeholder="optional tags, comma separated (e.g. java, revision)">

  <div class="action-row">
    <button class="action" id="saveBtn">Save</button>
    <button class="action" id="queryBtn">Query</button>
  </div>

  <div id="result"></div>

  <div id="stats">Loading graph stats...</div>

  <script>
    const API = "";
    let selectedSource = "notes";

    document.querySelectorAll("#sourceTags .tag-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#sourceTags .tag-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedSource = btn.dataset.tag;
      });
    });

    async function refreshStats() {
      const res = await fetch(API + "/graph/stats");
      const data = await res.json();
      document.getElementById("stats").innerText = `Graph: ${data.nodes} nodes, ${data.edges} edges`;
    }

    async function submitEntry(isQuery) {
      const content = document.getElementById("content").value.trim();
      if (!content) return;
      const extra = document.getElementById("extraTags").value
        .split(",").map(t => t.trim()).filter(t => t.length > 0);

      const resultBox = document.getElementById("result");
      resultBox.style.display = "block";
      resultBox.innerText = isQuery ? "Thinking..." : "Saving...";

      const res = await fetch(API + "/entries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: content,
          source_type: selectedSource,
          tags: extra,
          is_query: isQuery
        })              // Will see tomorrow, start at save on the frontend, go thorugh the data flow
      });
      const data = await res.json();

      if (isQuery) {
        resultBox.innerText = data.answer || "No answer generated.";
      } else {
        resultBox.innerText = `Saved as entry #${data.entry_id}. It will be added to the graph shortly.`;
        document.getElementById("content").value = "";
      }
      refreshStats();
    }

    document.getElementById("saveBtn").addEventListener("click", () => submitEntry(false));
    document.getElementById("queryBtn").addEventListener("click", () => submitEntry(true));

    refreshStats();
    setInterval(refreshStats, 5000);
  </script>

</body>

</html>
