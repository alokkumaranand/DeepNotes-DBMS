[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepnotes-local"
version = "0.1.0"
description = "Local personal knowledge memory with durable background organization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[tool.setuptools]
packages = ["deepnotes"]
